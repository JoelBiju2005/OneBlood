<svg width="512" height="512" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="dropGrad" cx="50%" cy="40%" r="60%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#EF1C25" />
      <stop offset="100%" stop-color="#8B0000" />
    </radialGradient>
    <radialGradient id="flameGrad" cx="50%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="60%" stop-color="#FF6B00" />
      <stop offset="100%" stop-color="#CC0000" />
    </radialGradient>
  </defs>

  <!-- Dark background circle for favicon clarity -->
  <circle cx="100" cy="100" r="100" fill="#0F0F1A" />

  <!-- Blood drop (slightly scaled to fit in circle) -->
  <path
    d="M100 12 C68 52 50 88 50 118 C50 154 72 188 100 188 C128 188 150 154 150 118 C150 88 132 52 100 12 Z"
    fill="url(#dropGrad)"
  />

  <!-- Supporting hand -->
  <path
    d="M62 148 Q72 137 82 143 Q91 148 100 143 Q109 137 118 143 Q128 148 138 142"
    stroke="white"
    stroke-width="5.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- "1" body -->
  <rect x="91" y="85" width="18" height="52" rx="2.5" fill="white" />
  <!-- "1" angled top -->
  <path d="M80 98 L91 85" stroke="white" stroke-width="7" stroke-linecap="round" />

  <!-- Flame -->
  <path
    d="M100 84 C96 76 89 69 93 60 C95 54 98 50 100 44 C102 50 105 54 107 60 C111 69 104 76 100 84 Z"
