  />
  <!-- Inner flame glow -->
  <path
    d="M100 79 C98 73 95 68 97 62 C98 58 99 56 100 52 C101 56 102 58 103 62 C105 68 102 73 100 79 Z"
    fill="white"
    opacity="0.5"
  />
</svg>