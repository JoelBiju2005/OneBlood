<svg width="512" height="614" viewBox="0 0 200 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="dropGrad" cx="50%" cy="40%" r="60%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#EF1C25" />
      <stop offset="100%" stop-color="#8B0000" />
